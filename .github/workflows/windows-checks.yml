name: Windows source checks and candidate build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-checks.yml'
      - 'backend/**'
      - 'desktop/**'
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-library:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin Rust test toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99.1
      - name: Check native harness formatting
        run: cargo fmt --manifest-path tests/desktop/Cargo.toml -- --check
      - name: Test native journal and control pipe
        run: cargo test --manifest-path tests/desktop/Cargo.toml --locked
      - name: Set up interoperability Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Install locked interoperability environment
        run: |
          uv python install 3.12.16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --python 3.12.16
      - name: Test real Rust and Python control interoperability
        run: |
          $env:CAFE_FIN_TEST_PYTHON = (Resolve-Path '.venv/Scripts/python.exe').Path
          cargo test --manifest-path tests/desktop/Cargo.toml --locked --test wire_interop -- --ignored

  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Install locked Python environment
        run: |
          uv python install 3.12.16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --python 3.12.16
      - name: Backend regression tests
        run: uv run --frozen python -m pytest tests -q
      - name: Lint and compile backend
        run: |
          uv run --frozen python -m ruff check backend/cafe_fin tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -m compileall -q backend/cafe_fin scripts
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked frontend packages
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Browser and real sidecar tests
        working-directory: frontend
        env:
          CAFE_FIN_REAL_API: '1'
        run: npm test
      - name: Feature browser integration tests
        run: |
          $featureConfigs = @(Get-ChildItem -LiteralPath 'tests' -Filter 'playwright.config.*' -File -Recurse | Sort-Object FullName)
          # The accounting real-API workflow is a separate bounded configuration;
          # million-row benchmarks remain opt-in measured host work.
          foreach ($accountingConfig in @('tests/accounting/ui/real.config.ts', 'tests/accounting/ui/schema.config.ts')) {
            if (Test-Path -LiteralPath $accountingConfig) {
              $featureConfigs += Get-Item -LiteralPath $accountingConfig
            }
          }
          $featureConfigs = @($featureConfigs | Sort-Object FullName -Unique)
          foreach ($featureConfig in $featureConfigs) {
            node frontend/node_modules/@playwright/test/cli.js test --config $featureConfig.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Pin Rust build toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99.1
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - name: Build Python sidecar and notices
        run: ./desktop/scripts/build-sidecar.ps1
      - name: Smoke frozen sidecar without developer PATH
        run: |
          $env:CAFE_FIN_TEST_SIDECAR = (Resolve-Path 'desktop/binaries/cafe-fin-sidecar-x86_64-pc-windows-msvc.exe').Path
          uv run --frozen python -m pytest tests/core/test_api_sidecar.py::test_sidecar_real_loopback_unicode_second_instance_and_restart -q
      - name: Test production native controller with matching frozen sidecar
        run: cargo test --manifest-path desktop/Cargo.toml --bin cafe-fin-desktop --locked -- --ignored --test-threads=1
      - name: Build native installer candidate
        working-directory: desktop
        run: ../frontend/node_modules/.bin/tauri.cmd build --bundles nsis --ci -- --locked
      - name: Record candidate hashes
        run: |
          $candidateFiles = @(Get-ChildItem -LiteralPath 'desktop/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($candidateFiles.Count -eq 0) { throw 'No installer candidate was produced.' }
          "## Native build candidate" >> $env:GITHUB_STEP_SUMMARY
          "Source commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "This runner is a build environment, not clean Windows client acceptance. No release was published." >> $env:GITHUB_STEP_SUMMARY
          foreach ($candidate in $candidateFiles) {
            $digest = Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256
            $receipt = "$($candidate.Name) | $($candidate.Length) bytes | SHA256 $($digest.Hash)"
            Write-Output $receipt
            $receipt >> $env:GITHUB_STEP_SUMMARY
          }

# Only source and synthetic fixtures run here. No application data, credentials,
# production release, persistent runner, artifact upload, or larger paid runner.
