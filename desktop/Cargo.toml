[package]
name = "cafe-fin-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rand = "=0.9.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json"] }

[target.'cfg(windows)'.dependencies]
winreg = { version = "=0.56.0", features = ["transactions"] }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
