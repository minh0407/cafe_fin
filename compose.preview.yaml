name: cafe-fin-local-preview
services:
  cafe-fin:
    build:
      context: .
      dockerfile: Dockerfile
      target: preview
    ports:
      - "127.0.0.1:1420:1420"
    volumes:
      - preview-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - preview-local
networks:
  preview-local:
    internal: true
volumes:
  preview-data:
