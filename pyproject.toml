[project]
name = "cafe-fin"
version = "0.1.0"
description = "Local Windows foundation for Cafe Fin"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "defusedxml==0.7.1",
    "fastapi==0.162.0",
    "lxml==6.1.1",
    "openpyxl==3.1.5",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "python-docx==1.2.0",
    "reportlab==4.4.9",
    "sqlalchemy==2.1.8",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cafe_fin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyinstaller==6.22.3",
    "pypdf==6.10.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
